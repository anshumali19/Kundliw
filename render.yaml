# Render Blueprint: Maharshi Kanad Jyotish Kendra
# Deploy: Render Dashboard > New > Blueprint > select this repository.
# Fill every variable marked `sync: false` when prompted (see docs/RENDER_DEPLOYMENT.md).

databases:
  - name: kanad-db
    databaseName: kanad_jyotish
    user: kanad
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: [] # internal connections only

envVarGroups:
  - name: kanad-shared
    envVars:
      # Generated once by Render; shared by the web service and the cron job.
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: kanad-jyotish
    runtime: node
    plan: starter # persistent disk requires a paid instance
    region: singapore
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy && node scripts/render-init.js
    # NEXTAUTH_URL falls back to the service's public onrender.com URL.
    startCommand: NEXTAUTH_URL="${NEXTAUTH_URL:-$RENDER_EXTERNAL_URL}" npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: kanad-storage
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - fromGroup: kanad-shared
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: kanad-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true # back this up! losing it makes stored API keys unreadable
      - key: INITIAL_ADMIN_PASSWORD
        sync: false # you choose it; used once to create the Super Admin
      - key: NEXTAUTH_URL
        sync: false # optional: set to your custom domain, else the onrender.com URL is used
      - key: TRUST_PROXY
        value: "true"
      - key: DEMO_MODE
        value: "true" # keeps placeholder adapters (payments/astro) active until real keys are added
      - key: STORAGE_PATH
        value: /var/data/storage
      - key: VAULT_STORAGE_PATH
        value: /var/data/storage/vault
      # Paid / third-party API placeholders. Leave empty and fill later, either here
      # or in the admin panel at /admin/settings/keys (encrypted at rest).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: ASTROSAGE_USER_ID
        sync: false
      - key: ASTROSAGE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false

  # Replaces Vercel Cron: expires unpaid reservations every 10 minutes.
  - type: cron
    name: kanad-expire-orders
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET"
      "http://$APP_HOSTPORT/api/cron/expire-orders"
    envVars:
      - fromGroup: kanad-shared
      - key: APP_HOSTPORT
        fromService:
          type: web
          name: kanad-jyotish
          property: hostport
